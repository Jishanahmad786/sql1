
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL MCQ Quiz | Jishan EduHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3, #d1fae5);
    min-height: 100vh;
    padding: 20px;
    color: #1e293b;
}

.container {
    max-width: 800px;
    margin: 20px auto;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(15, 23, 42, 0.15);
}

.header {
    background: linear-gradient(120deg, #4338ca, #9333ea);
    color: #ffffff;
    text-align: center;
    padding: 28px 15px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.header p {
    font-size: 15px;
    line-height: 1.6;
}

.quiz-info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 17px 20px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
    font-weight: bold;
    color: #334155;
}

.progress {
    height: 8px;
    background: #e2e8f0;
}

.progress-bar {
    width: 4%;
    height: 100%;
    background: linear-gradient(90deg, #4f46e5, #ec4899);
    transition: width 0.3s ease;
}

.quiz-body {
    padding: 25px;
}

.question-number {
    color: #7c3aed;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 13px;
}

.question {
    font-size: 22px;
    line-height: 1.5;
    margin-bottom: 22px;
    color: #0f172a;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

button.option {
    display: block;
    flex: none;
    width: 100%;
    min-width: 0;
    text-align: left;
    padding: 15px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    background: #ffffff;
    color: #1e293b;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: normal;
    line-height: 1.5;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
}

button.option:hover {
    border-color: #6366f1;
    background: #eef2ff;
    color: #1e293b;
}

button.option.selected {
    border-color: #4f46e5;
    background: #e0e7ff;
    color: #312e81;
    font-weight: bold;
}

button.option.correct {
    border-color: #16a34a;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
}

button.option.wrong {
    border-color: #dc2626;
    background: #fee2e2;
    color: #991b1b;
    font-weight: bold;
}

button.option:disabled {
    opacity: 1;
    cursor: default;
}

.feedback {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.7;
}

.feedback.show {
    display: block;
}

.feedback.success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
}

.feedback.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
}

button.action {
    flex: 1;
    min-width: 110px;
    border: none;
    border-radius: 10px;
    padding: 13px 12px;
    color: #ffffff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button.action:hover {
    filter: brightness(0.92);
}

button.action:disabled {
    background: #cbd5e1;
    color: #475569;
    cursor: not-allowed;
    filter: none;
}

.prev-btn {
    background: #475569;
}

.answer-btn {
    background: #0891b2;
}

.next-btn {
    background: #7c3aed;
}

.result {
    display: none;
    text-align: center;
    padding: 35px 20px;
}

.result h2 {
    color: #4f46e5;
    font-size: 27px;
    margin-bottom: 20px;
}

.result p {
    font-size: 18px;
    margin: 13px 0;
    line-height: 1.5;
}

.restart-btn {
    background: #4f46e5;
    border: none;
    color: white;
    padding: 14px 25px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    font-size: 16px;
}

.footer {
    padding: 17px;
    text-align: center;
    background: #f8fafc;
    color: #475569;
    font-size: 13px;
}

@media (max-width: 500px) {
    body {
        padding: 10px;
    }

    .container {
        margin: 5px auto;
        border-radius: 15px;
    }

    .header h1 {
        font-size: 25px;
    }

    .quiz-body {
        padding: 18px;
    }

    .question {
        font-size: 19px;
    }

    button.option {
        font-size: 15px;
        padding: 13px;
    }

    .buttons {
        gap: 8px;
    }

    button.action {
        min-width: 90px;
        padding: 12px 8px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>🎓 Jishan EduHub</h1>
        <p>SQL Practice Test | 25 Multiple Choice Questions</p>
        <p>Learn • Practice • Improve</p>
    </header>

    <div class="quiz-info">
        <span>📘 Subject: SQL</span>
        <span id="counter">Question 1 / 25</span>
        <span id="score">Score: 0</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <main class="quiz-body" id="quiz">

        <div class="question-number" id="qNumber"></div>

        <h2 class="question" id="question"></h2>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback" aria-live="polite"></div>

        <div class="buttons">
            <button type="button" class="action prev-btn"
                id="prevBtn" onclick="previousQuestion()">
                ← Previous
            </button>

            <button type="button" class="action answer-btn"
                id="answerBtn" onclick="showAnswer()">
                Show Answer
            </button>

            <button type="button" class="action next-btn"
                id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>

    </main>

    <section class="result" id="result">
        <h2>🎉 Quiz Completed!</h2>
        <p id="finalScore"></p>
        <p id="percentage"></p>
        <p id="remark"></p>
        <button type="button" class="restart-btn" onclick="restartQuiz()">
            🔄 Restart Quiz
        </button>
    </section>

    <footer class="footer">
        © 2026 Jishan EduHub | Keep Learning, Keep Growing
    </footer>

</div>

<script>
"use strict";

const questions = [
{
q: "What does SQL stand for?",
o: ["Structured Query Language", "Simple Question Language", "Standard Quick Language", "System Query Logic"],
a: 0,
e: "SQL stands for Structured Query Language. It is used to work with relational databases."
},
{
q: "Which SQL command retrieves data from a table?",
o: ["GET", "OPEN", "SELECT", "FETCH TABLE"],
a: 2,
e: "SELECT retrieves data from one or more tables."
},
{
q: "Which command inserts a new record into a table?",
o: ["ADD", "INSERT INTO", "UPDATE", "CREATE"],
a: 1,
e: "INSERT INTO adds new rows to a table."
},
{
q: "Which command modifies existing records?",
o: ["CHANGE", "MODIFY ROW", "UPDATE", "ALTER DATA"],
a: 2,
e: "UPDATE changes existing data in a table."
},
{
q: "Which clause filters rows according to a condition?",
o: ["ORDER BY", "WHERE", "GROUP BY", "SELECT"],
a: 1,
e: "WHERE specifies which rows should be included in the result."
},
{
q: "Which command removes a table and its structure?",
o: ["DELETE", "REMOVE", "DROP TABLE", "CLEAR"],
a: 2,
e: "DROP TABLE removes the table structure and its data."
},
{
q: "Which keyword eliminates duplicate rows from results?",
o: ["UNIQUE", "DISTINCT", "DIFFERENT", "ONLY"],
a: 1,
e: "SELECT DISTINCT returns unique combinations of selected values."
},
{
q: "Which SQL function counts rows?",
o: ["SUM()", "TOTAL()", "COUNT()", "NUMBER()"],
a: 2,
e: "COUNT(*) counts rows. COUNT(column) counts non-NULL values in that column."
},
{
q: "Which clause sorts query results?",
o: ["SORT", "ORDER BY", "ARRANGE", "GROUP BY"],
a: 1,
e: "ORDER BY sorts results in ascending (ASC) or descending (DESC) order."
},
{
q: "Which constraint uniquely identifies each row?",
o: ["FOREIGN KEY", "NOT NULL", "PRIMARY KEY", "DEFAULT"],
a: 2,
e: "A PRIMARY KEY uniquely identifies each row and does not allow NULL values."
},
{
q: "Which constraint establishes a relationship between tables?",
o: ["PRIMARY KEY", "FOREIGN KEY", "CHECK", "DEFAULT"],
a: 1,
e: "A FOREIGN KEY references a key in another table or the same table."
},
{
q: "Which operator checks whether a value is within a range?",
o: ["BETWEEN", "RANGE", "WITHIN", "INRANGE"],
a: 0,
e: "BETWEEN checks whether a value falls within an inclusive range."
},
{
q: "Which operator is used for pattern matching?",
o: ["MATCH", "LIKE", "EQUALS", "SEARCH"],
a: 1,
e: "LIKE matches patterns using wildcards such as % and _."
},
{
q: "Which wildcard represents zero or more characters in LIKE?",
o: ["_", "*", "%", "#"],
a: 2,
e: "% represents zero or more characters in a LIKE pattern."
},
{
q: "Which function returns the highest value?",
o: ["TOP()", "HIGH()", "MAX()", "UPPER()"],
a: 2,
e: "MAX() returns the maximum value in a set."
},
{
q: "Which aggregate function calculates the average?",
o: ["MEAN()", "AVG()", "AVERAGE()", "MID()"],
a: 1,
e: "AVG() calculates the average of non-NULL numeric values."
},
{
q: "Which clause groups rows with matching values?",
o: ["ORDER BY", "WHERE", "GROUP BY", "DISTINCT BY"],
a: 2,
e: "GROUP BY creates groups so aggregate functions can operate on each group."
},
{
q: "Which clause filters grouped results?",
o: ["WHERE", "HAVING", "ORDER BY", "LIMIT"],
a: 1,
e: "HAVING filters groups, often using aggregate conditions."
},
{
q: "Which JOIN returns only rows that match in both tables?",
o: ["LEFT JOIN", "FULL JOIN", "INNER JOIN", "CROSS JOIN"],
a: 2,
e: "INNER JOIN returns rows satisfying the join condition in both tables."
},
{
q: "Which JOIN preserves every row from the left table?",
o: ["INNER JOIN", "LEFT JOIN", "CROSS JOIN", "SELF JOIN"],
a: 1,
e: "LEFT JOIN keeps all left-table rows and includes matching right-table data when available."
},
{
q: "Which command deletes selected rows from a table?",
o: ["DROP", "DELETE", "ERASE TABLE", "REMOVE TABLE"],
a: 1,
e: "DELETE removes rows. Without a WHERE clause, it can delete every row."
},
{
q: "Which command changes a table's structure?",
o: ["UPDATE", "CHANGE", "ALTER TABLE", "REPLACE"],
a: 2,
e: "ALTER TABLE can add, modify, or remove columns and constraints, depending on the database."
},
{
q: "What does NULL generally represent in SQL?",
o: ["Zero", "Empty text", "Missing or unknown value", "False"],
a: 2,
e: "NULL represents missing or unknown data. Use IS NULL to test for it."
},
{
q: "Which command makes transaction changes permanent?",
o: ["SAVE", "COMMIT", "LOCK", "FINISH"],
a: 1,
e: "COMMIT saves the current transaction's changes permanently."
},
{
q: "Which command undoes uncommitted transaction changes?",
o: ["UNDO", "CANCEL", "ROLLBACK", "REVERSE"],
a: 2,
e: "ROLLBACK undoes changes in the current transaction that have not been committed."
}
];

let current = 0;
let answers = Array(questions.length).fill(null);
let revealed = Array(questions.length).fill(false);

function calculateScore() {
    return answers.reduce((total, answer, index) => {
        return total + (answer === questions[index].a ? 1 : 0);
    }, 0);
}

function renderQuestion() {
    const item = questions[current];

    document.getElementById("counter").textContent =
        `Question ${current + 1} / ${questions.length}`;

    document.getElementById("qNumber").textContent =
        `QUESTION ${current + 1}`;

    document.getElementById("question").textContent = item.q;

    document.getElementById("score").textContent =
        `Score: ${calculateScore()}`;

    document.getElementById("progress").style.width =
        `${((current + 1) / questions.length) * 100}%`;

    const optionsBox = document.getElementById("options");
    optionsBox.replaceChildren();

    item.o.forEach((option, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent =
            `${String.fromCharCode(65 + index)}. ${option}`;

        button.setAttribute("aria-pressed",
            String(answers[current] === index));

        if (answers[current] === index) {
            button.classList.add("selected");
        }

        if (revealed[current]) {
            button.disabled = true;

            if (index === item.a) {
                button.classList.add("correct");
            }

            if (answers[current] === index && index !== item.a) {
                button.classList.add("wrong");
            }
        } else {
            button.addEventListener("click", function() {
                selectAnswer(index);
            });
        }

        optionsBox.appendChild(button);
    });

    document.getElementById("prevBtn").disabled = current === 0;

    document.getElementById("nextBtn").textContent =
        current === questions.length - 1 ? "Finish ✓" : "Next →";

    document.getElementById("answerBtn").textContent =
        revealed[current] ? "Answer Shown" : "Show Answer";

    document.getElementById("answerBtn").disabled = revealed[current];

    const feedback = document.getElementById("feedback");

    feedback.className = "feedback";
    feedback.textContent = "";

    if (revealed[current]) {
        const correct = answers[current] === item.a;

        feedback.classList.add("show");
        feedback.classList.add(correct ? "success" : "error");

        feedback.textContent =
            (correct
                ? "Correct! "
                : "Correct answer: " + item.o[item.a] + ". ") + item.e;
    }
}

function selectAnswer(index) {
    if (revealed[current]) return;

    answers[current] = index;
    renderQuestion();
}

function showAnswer() {
    if (revealed[current]) return;

    revealed[current] = true;
    renderQuestion();
}

function previousQuestion() {
    if (current > 0) {
        current--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (current < questions.length - 1) {
        current++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    const score = calculateScore();
    const percentage = Math.round(score / questions.length * 100);

    document.getElementById("finalScore").textContent =
        `Your Score: ${score} / ${questions.length}`;

    document.getElementById("percentage").textContent =
        `Percentage: ${percentage}%`;

    document.getElementById("remark").textContent =
        percentage >= 80
            ? "Excellent work! 🌟"
            : percentage >= 60
                ? "Good job! Keep practising. 👍"
                : "Keep learning SQL and try again! 💪";
}

function restartQuiz() {
    current = 0;
    answers = Array(questions.length).fill(null);
    revealed = Array(questions.length).fill(false);

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    renderQuestion();
}

renderQuestion();
</script>

</body>
</html>
